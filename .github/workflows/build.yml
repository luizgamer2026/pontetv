name: Build APKs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar celular + TV
        run: gradle --no-daemon --stacktrace :phone:assembleDebug :tv:assembleDebug

      - name: APK do celular
        uses: actions/upload-artifact@v4
        with:
          name: PonteTV-Celular-APK
          path: phone/build/outputs/apk/debug/*.apk

      - name: APK da Android TV
        uses: actions/upload-artifact@v4
        with:
          name: PonteTV-AndroidTV-APK
          path: tv/build/outputs/apk/debug/*.apk
